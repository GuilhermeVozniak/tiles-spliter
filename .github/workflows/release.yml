name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds a signed + notarized universal DMG named per @tiles-spliter/shared's
# contract (tiles-spliter_<version>_darwin_universal.dmg), then points the
# Homebrew tap at it. See docs/RELEASE.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Gate the release on the full workspace suite (shared, desktop frontend,
  # web, and the Go desktop app) plus a dedicated Go race-test pass, all on
  # macos-14 since apps/desktop only compiles on Darwin.
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - run: bun install --frozen-lockfile
      - name: Install Playwright Chromium (web e2e)
        run: cd apps/web && bunx playwright install --with-deps chromium
      - name: Full workspace gate (lint, test, build)
        run: bunx turbo run test lint build --continue
      - name: Go race tests
        working-directory: apps/desktop
        run: go test ./... -race

  build-release:
    needs: test
    runs-on: macos-14
    env:
      # secrets are not readable in step-level `if:`; surface presence here.
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
    # Consumed by bump-homebrew-cask. dmg_sha256 stays empty when signing is
    # skipped, which is how that job knows no DMG was published.
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg_sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - run: bun install --frozen-lockfile

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp Info.plist version
        run: |
          PLIST=apps/desktop/build/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.version }}" "$PLIST"

      # Signing is skipped when the signing secrets are absent (e.g. a tag
      # pushed without repo secrets configured yet), so build-release simply
      # does nothing rather than fail.
      - name: Import signing certificate
        if: env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Keychain Access p12 exports hold only the leaf cert + key; import
          # Apple's Developer ID G2 intermediate too so the chain validates.
          curl -sSLo "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm "$RUNNER_TEMP/cert.p12"
          # fail here, not at codesign, if the p12 lacks a Developer ID identity.
          security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application"

      - name: Resolve codesign identity
        if: env.HAS_MACOS_SIGNING == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Sign by the identity's hash with --keychain pinned (name-based
          # resolution reported "no identity found" on GitHub runners).
          HASH=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/{print $2; exit}')
          test -n "$HASH"
          echo "CODESIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          echo "CODESIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, package (scripts/release.sh)
        if: env.HAS_MACOS_SIGNING == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/release.sh

      - name: Checksum DMG (for the Homebrew cask bump)
        id: checksum
        if: env.HAS_MACOS_SIGNING == 'true'
        run: echo "sha256=$(shasum -a 256 dist/tiles-spliter_*.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: env.HAS_MACOS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tiles-spliter_*.dmg
          generate_release_notes: true

  # Point the Homebrew tap (GuilhermeVozniak/homebrew-tap) at the DMG that was
  # just published so `brew install --cask GuilhermeVozniak/tap/tiles-spliter`
  # resolves to the new version. Runs only when build-release actually shipped
  # a DMG. Pushing to the tap needs HOMEBREW_TAP_TOKEN (docs/RELEASE.md);
  # without it the cask is still audited but the push is skipped with a warning.
  bump-homebrew-cask:
    name: Bump Homebrew cask
    needs: build-release
    if: needs.build-release.outputs.dmg_sha256 != ''
    runs-on: macos-14
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      TAP: guilhermevozniak/tap
      VERSION: ${{ needs.build-release.outputs.version }}
      SHA256: ${{ needs.build-release.outputs.dmg_sha256 }}
    steps:
      - name: Tap guilhermevozniak/tap
        run: brew tap "$TAP"

      - name: Rewrite version and sha256 in Casks/tiles-spliter.rb
        run: |
          CASK="$(brew --repository "$TAP")/Casks/tiles-spliter.rb"
          sed -i '' -E "s|^  version \".*\"$|  version \"$VERSION\"|" "$CASK"
          sed -i '' -E "s|^  sha256 \".*\"$|  sha256 \"$SHA256\"|" "$CASK"
          grep -q "^  version \"$VERSION\"" "$CASK"
          grep -q "^  sha256 \"$SHA256\"" "$CASK"
          git -C "$(dirname "$CASK")" --no-pager diff

      # `brew fetch` downloads the DMG from the release and verifies sha256
      # against it, so a wrong asset name or checksum fails here, not on users.
      - name: Audit and fetch the updated cask
        run: |
          brew audit --cask "$TAP/tiles-spliter"
          brew fetch --cask "$TAP/tiles-spliter"

      - name: Push to the tap
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd "$(brew --repository "$TAP")"
          if git diff --quiet; then echo "cask already at $VERSION; nothing to push"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "tiles-spliter $VERSION"
          git push "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/GuilhermeVozniak/homebrew-tap.git" HEAD:main

      - name: Warn that the tap was not bumped
        if: env.HAS_TAP_TOKEN != 'true'
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; homebrew-tap was not bumped to $VERSION. Add the secret (docs/RELEASE.md) or edit Casks/tiles-spliter.rb by hand."
